<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI-ACEP - Inventarisasi Aset Digital</title>

  <!-- CSS Utama -->
  <link rel="stylesheet" href="style.css">

  <!-- Icon FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library QR Code Scanner Kamera -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <!-- HEADER DENGAN LOGO KIRI & KANAN -->
  <header class="app-header">
    <div class="header-container" style="display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 10px;">
      
      <!-- LOGO KIRI (Contoh: Logo Pemkot Serang) -->
      <div class="header-logo-left">
        <img src="logo.png" alt="Logo Pemkot" style="height: 50px; width: auto; object-fit: contain;">
      </div>

      <!-- JUDUL APLIKASI (DI TENGAH) -->
      <div class="header-title" style="text-align: center;">
        <h1 style="margin: 0; font-size: 20px; font-weight: bold; color: #1e293b;">SI-ACEP</h1>
        <p style="margin: 2px 0 0 0; font-size: 12px; color: #64748b;">Sistem Inventarisasi Aset Digital Satpol PP</p>
      </div>

      <!-- LOGO KANAN (Contoh: Logo Satpol PP) -->
      <div class="header-logo-right">
        <img src="polpp.png" alt="Logo Satpol PP" style="height: 50px; width: auto; object-fit: contain;">
      </div>

    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="main-container">

    <section class="content-card">
      <div class="card-title">
        <h2>Pindaian QR Code Aset</h2>
        <p>Arahkan kamera ke stiker QR Aset untuk pencatatan otomatis.</p>
      </div>

      <!-- AREA KAMERA SCANNER -->
      <div class="scanner-box">
        <div id="reader" style="width: 100%;"></div>
      </div>

      <!-- LEMBAR INFORMASI ASET -->
      <div class="info-card">
        <h3 style="margin-bottom: 15px; border-bottom: 2px solid #0284c7; padding-bottom: 8px; color: #1e293b;">
          <i class="fa-solid fa-file-lines"></i> Lembar Informasi Aset
        </h3>
        
        <div id="infoDetailAset">
          <p style="text-align: center; color: #64748b; padding: 15px 0;">
            <i class="fa-solid fa-qrcode" style="font-size: 28px; margin-bottom: 8px; display: block; color: #94a3b8;"></i>
            Silakan scan QR Code barang di atas untuk menampilkan Lembar Informasi Aset...
          </p>
        </div>
      </div>

      <!-- TOMBOL AKSI: DOWNLOAD & CETAK HASIL INVENTARISASI -->
      <div class="action-buttons" style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button type="button" class="btn btn-download" style="background-color: #059669; color: white;">
          <i class="fa-solid fa-file-arrow-down"></i> Download Rekap Inventarisasi
        </button>
        <button type="button" class="btn btn-print">
          <i class="fa-solid fa-print"></i> Cetak Hasil Inventarisasi Aset
        </button>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="app-footer">
    <p>SI-ACEP &copy; Satuan Polisi Pamong Praja</p>
  </footer>

  <!-- SCRIPT UTAMA -->
  <script src="script.js"></script>
</body>
</html>
