<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <title>SI-ACEP - Auto Scan Sistem</title>

  <!-- External Resources -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    :root { --primary: #0284c7; --primary-soft: #e0f2fe; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --success: #059669; --success-soft: #d1fae5; --danger: #ef4444; --danger-dark: #991b1b; --radius: 16px; --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 30px; }
    
    .app-header { background-color: var(--card-bg); padding: 16px; border-bottom: 1px solid var(--border); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03); position: sticky; top: 0; z-index: 100; text-align: center; }
    .app-header h1 { font-size: 20px; font-weight: 800; color: var(--text); margin: 0; letter-spacing: -0.5px; }
    .app-header p { font-size: 9px; color: var(--text-muted); font-weight: 700; margin-top: 2px; text-transform: uppercase; }
    
    .main-container { max-width: 440px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
    .content-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow); }
    
    .card-title h2 { font-size: 16px; color: var(--text); font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    
    #reader { border: 2px dashed #cbd5e1 !important; border-radius: var(--radius) !important; overflow: hidden !important; background-color: #0f172a !important; padding: 4px !important; width: 100% !important; }
    #reader video { object-fit: cover !important; border-radius: 12px !important; width: 100% !important; max-height: 240px !important; }
    #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { display: none !important; }

    .btn { border: none; padding: 13px 18px; border-radius: 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }
    .btn-primary { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-dark { background: #1e293b; color: white; }
    .btn-indigo { background: #4f46e5; color: white; }
    .btn-success { background: var(--success); color: white; }

    .input-group { display: flex; gap: 8px; margin-top: 16px; }
    .form-control { flex: 1; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 13.5px; outline: none; background: #f8fafc; }
    .form-control:focus { border-color: var(--primary); background: #ffffff; }

    .info-detail-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .info-item { border-bottom: 1px dashed var(--border); padding-bottom: 8px; display: flex; flex-direction: column; }
    .info-label { font-size: 10.5px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
    .info-value { font-size: 13.5px; font-weight: 600; color: var(--text); margin-top: 2px; }

    /* Modals System */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: white; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; text-align: center; }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>SI-ACEP</h1>
    <p>Sistem Inventarisasi Aset Cepat Efisien & Praktis</p>
  </header>

  <main class="main-container">
    
    <!-- HALAMAN SCANNER -->
    <section id="page-scanner" class="content-card">
      <div class="card-title">
        <h2><i class="fa-solid fa-qrcode" style="color: var(--primary);"></i> Scan Otomatis</h2>
      </div>
      
      <div id="reader"></div>
      
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button id="btnStartCamera" type="button" class="btn btn-primary" style="flex: 3;">
          <i class="fa-solid fa-camera"></i> Buka Kamera
        </button>
        <button id="btnStopCamera" type="button" class="btn btn-danger" style="flex: 3; display: none;">
          <i class="fa-solid fa-stop"></i> Tutup
        </button>
        <button id="btnTorch" type="button" class="btn btn-dark" style="flex: 1; display: none;" onclick="toggleFlashlight()">
          <i class="fa-solid fa-bolt"></i>
        </button>
      </div>

      <div class="input-group">
        <input type="text" id="inputKodeManual" class="form-control" placeholder="Cari kode manual...">
        <button id="btnCariManual" type="button" class="btn btn-primary" style="width: auto;"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <button type="button" onclick="openPinModal()" class="btn btn-dark" style="margin-top: 24px;">
        <i class="fa-solid fa-user-shield"></i> Menu Petugas
      </button>
    </section>

    <!-- HALAMAN INFORMASI (SETELAH AUTO-SAVE) -->
    <section id="page-informasi" class="content-card" style="display: none;">
      <div class="card-title">
        <h2 style="margin: 0;"><i class="fa-solid fa-file-lines" style="color: var(--primary);"></i> Hasil Pencatatan</h2>
      </div>

      <div id="infoDetailAset" style="background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 16px;"></div>

      <!-- PANEL PETUGAS (Disederhanakan) -->
      <div id="panelPetugas" style="display: none; margin-top: 16px; background: #ffffff; border: 1.5px solid var(--border); border-radius: 12px; padding: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
          <h3 style="margin: 0; font-size: 13px; color: var(--text);"><i class="fa-solid fa-key" style="color: var(--primary);"></i> Opsi Petugas</h3>
          <button type="button" onclick="closePanelPetugas()" style="background: none; border: none; font-size: 11px; color: var(--danger); font-weight: bold; cursor: pointer;">Tutup</button>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button type="button" onclick="cetakStikerAktif()" class="btn btn-indigo" style="font-size: 12px; padding: 10px;"><i class="fa-solid fa-qrcode"></i> Cetak Stiker</button>
          <button type="button" onclick="hapusDataAktif()" class="btn btn-danger" style="font-size: 12px; padding: 10px;"><i class="fa-solid fa-trash-can"></i> Hapus Status</button>
          <button type="button" onclick="cetakHasilInventaris()" class="btn btn-success" style="grid-column: span 2; font-size: 12px; padding: 10px;"><i class="fa-solid fa-file-excel"></i> Ekspor Laporan Data</button>
        </div>
      </div>

    </section>
  </main>

  <!-- MODAL PIN -->
  <div id="modalPin" class="modal">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px; color: var(--text);">Otentikasi Petugas</h3>
      <input type="password" id="inputPinPetugas" maxlength="6" inputmode="numeric" placeholder="------" style="width: 100%; padding: 10px; font-size: 22px; text-align: center; letter-spacing: 8px; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 16px; outline: none;">
      <div style="display: flex; gap: 8px;">
        <button type="button" onclick="document.getElementById('modalPin').style.display='none'" class="btn btn-dark" style="flex: 1;">Batal</button>
        <button type="button" onclick="verifikasiPin()" class="btn btn-primary" style="flex: 1;">Masuk</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIG: GANTI URL DI BAWAH INI DENGAN URL DEPLOY GAS MAS ACEP
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4DcVVh0ORsCAngL3PzQChef8Rzryo1Ts4e1ySKchv_WSa7d2zUY9yXWK7NgVai1yP/exec";
    const PIN_PETUGAS_DEFAULT = "123456";

    let scannerAktif = true;
    let html5QrCode = null;
    let isTorchOn = false;
    let autoSaveCache = new Set(); 

    const scanBeepSound = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUtvT18AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8AZv8=");

    document.addEventListener("DOMContentLoaded", () => {
      html5QrCode = new Html5Qrcode("reader");

      window.mulaiKamera = function () {
        if (html5QrCode.isScanning) return;
        scannerAktif = true;
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 250, height: 250 }, disableFlip: true, aspectRatio: 1.0 },
          (decodedText) => {
            if (!scannerAktif) return;
            scannerAktif = false;
            triggerSuccessFeedback();
            matikanKamera();
            window.autoCatatInventaris(decodedText);
          },
          () => {}
        ).then(() => {
          document.getElementById("btnStartCamera").style.display = "none";
          document.getElementById("btnStopCamera").style.display = "inline-flex";
          document.getElementById("btnTorch").style.display = "inline-flex";
        });
      };

      function matikanKamera() {
        if (html5QrCode && html5QrCode.isScanning) {
          html5QrCode.stop().then(() => {
            document.getElementById("btnStartCamera").style.display = "inline-flex";
            document.getElementById("btnStopCamera").style.display = "none";
            document.getElementById("btnTorch").style.display = "none";
          });
        }
      }

      document.getElementById("btnStartCamera").addEventListener("click", mulaiKamera);
      document.getElementById("btnStopCamera").addEventListener("click", matikanKamera);
      
      document.getElementById("btnCariManual").addEventListener("click", () => {
        const kode = document.getElementById("inputKodeManual").value.trim();
        if (kode) { scannerAktif = false; matikanKamera(); window.autoCatatInventaris(kode); }
      });

      mulaiKamera();
    });

    // ==========================================
    // LOGIKA INTI: AUTO-SAVE LANGSUNG KETIKA SCAN
    // ==========================================
    window.autoCatatInventaris = function(kodeQR) {
      const kodeBersih = (kodeQR || "").trim();
      if (!kodeBersih) return alert("Kode tidak valid!");

      document.getElementById("page-scanner").style.display = "none";
      document.getElementById("page-informasi").style.display = "block";
      localStorage.setItem("print_kode", kodeBersih);
      
      const infoContainer = document.getElementById("infoDetailAset");

      // Cegah double-save jika kode yang sama discan berturut-turut dengan cepat
      if(autoSaveCache.has(kodeBersih)) {
          window.tampilkanDetailAset(kodeBersih);
          return;
      }

      // Tampilkan Loading State UI
      infoContainer.innerHTML = `
        <div style="text-align:center; padding: 40px 10px;">
          <i class="fa-solid fa-cloud-arrow-up fa-bounce" style="font-size:42px; color:var(--primary);"></i>
          <h3 style="margin-top:16px; color:var(--text); font-size:16px;">Mencatat Aset...</h3>
          <p style="font-size:12px; font-family:monospace; color:var(--text-muted); margin-top:4px;">Kode: ${kodeBersih}</p>
        </div>
      `;

      // Eksekusi API Auto-Update ke Google Sheets
      const bodyParams = new URLSearchParams();
      bodyParams.append("action", "update_inventaris");
      bodyParams.append("kode", kodeBersih);
      bodyParams.append("foto", ""); // Foto dikosongkan sesuai request

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: bodyParams.toString()
      })
      .then(res => res.json())
      .then(data => {
        if(data.result === "success") {
            autoSaveCache.add(kodeBersih); // Simpan status sukses di sesi ini
        }
        window.tampilkanDetailAset(kodeBersih);
      })
      .catch(err => {
        console.error(err);
        window.tampilkanDetailAset(kodeBersih); // Tetap tampilkan detail walau update gagal
      });
    };

    // ==========================================
    // PENGAMBILAN & RENDER DETAIL UI
    // ==========================================
    window.tampilkanDetailAset = function(kodeBersih) {
      fetch(`${SCRIPT_URL}?action=get_detail&kode=${encodeURIComponent(kodeBersih)}`)
        .then(res => res.json())
        .then(data => {
          const infoContainer = document.getElementById("infoDetailAset");
          if (data && data.result === "found") {
            const isTerinventaris = (data.sudah_inventaris === true);
            infoContainer.innerHTML = `
              <div style="text-align: center; margin-bottom: 16px;">
                <span style="display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px; font-size:11px; font-weight:800; background:${isTerinventaris ? 'var(--success-soft)' : 'var(--danger-soft)'}; color:${isTerinventaris ? '#065f46' : 'var(--danger-dark)'};">
                  <i class="fa-solid ${isTerinventaris ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> 
                  ${isTerinventaris ? 'ASET BERHASIL TERCATAT' : 'ASET BELUM TERCATAT'}
                </span>
              </div>
              <div class="info-detail-grid">
                <div class="info-item"><span class="info-label">ID / KODE BARANG</span><span class="info-value" style="font-family:monospace; color:var(--primary); font-size:15px;">${data.kode}</span></div>
                <div class="info-item"><span class="info-label">NAMA ASET</span><span class="info-value">${data.nama} - ${data.merk}</span></div>
                <div class="info-item"><span class="info-label">TAHUN PEROLEHAN</span><span class="info-value">${data.tahun_perolehan}</span></div>
                <div class="info-item"><span class="info-label">KONDISI FISIK</span><span class="info-value">${data.kondisi_status}</span></div>
              </div>
              <button type="button" onclick="window.kembaliScan()" class="btn btn-primary" style="margin-top: 24px;">
                <i class="fa-solid fa-arrow-left"></i> Scan Barang Lain
              </button>
            `;
          } else {
            infoContainer.innerHTML = `
              <div style="text-align:center; padding: 20px;">
                <i class="fa-solid fa-circle-xmark" style="font-size:36px; color:var(--danger);"></i>
                <h3 style="margin-top:12px; color:var(--danger);">Aset Tidak Ditemukan</h3>
                <button type="button" onclick="window.kembaliScan()" class="btn btn-primary" style="margin-top: 16px;">Kembali</button>
              </div>`;
          }
        })
        .catch(() => {
          document.getElementById("infoDetailAset").innerHTML = `<p style="text-align:center; color:red;">Gagal memuat detail data.</p><button class="btn btn-primary" onclick="window.kembaliScan()">Kembali</button>`;
        });
    };

    window.kembaliScan = function() {
      document.getElementById("page-informasi").style.display = "none";
      document.getElementById("page-scanner").style.display = "block";
      document.getElementById("inputKodeManual").value = "";
      window.mulaiKamera();
    };

    // Helper Functions Tambahan
    function triggerSuccessFeedback() {
      try { scanBeepSound.play().catch(()=>{}); navigator.vibrate([100,50,100]); } catch (e) {}
    }

    async function toggleFlashlight() {
      if (html5QrCode && html5QrCode.isScanning) {
        isTorchOn = !isTorchOn;
        await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] }).catch(()=>{});
        const btn = document.getElementById("btnTorch");
        btn.classList.toggle("btn-warning", isTorchOn);
        btn.classList.toggle("btn-dark", !isTorchOn);
      }
    }

    // Modal Petugas Logic
    window.openPinModal = () => { document.getElementById("modalPin").style.display = "flex"; };
    window.verifikasiPin = () => {
      if (document.getElementById("inputPinPetugas").value === PIN_PETUGAS_DEFAULT) {
        document.getElementById("modalPin").style.display = "none";
        document.getElementById("panelPetugas").style.display = "block";
        document.getElementById("inputPinPetugas").value = "";
      } else { alert("PIN Salah!"); }
    };
    window.closePanelPetugas = () => { document.getElementById("panelPetugas").style.display = "none"; };

    window.cetakStikerAktif = () => {
      const kode = localStorage.getItem("print_kode");
      if (kode) window.open(`${SCRIPT_URL}?action=cetak_stiker_massal&kodes=${encodeURIComponent(kode)}`, "_blank");
    };

    window.hapusDataAktif = () => {
      const kode = localStorage.getItem("print_kode");
      if (kode && confirm(`Reset status inventarisasi aset [${kode}]?`)) {
        fetch(`${SCRIPT_URL}?action=hapus_inventaris&kode=${encodeURIComponent(kode)}`)
          .then(() => { autoSaveCache.delete(kode); window.tampilkanDetailAset(kode); alert("Berhasil dihapus!"); });
      }
    };
    
    window.cetakHasilInventaris = () => { window.open(`${SCRIPT_URL}?action=export_hasil_excel`, "_blank"); };
  </script>
</body>
</html>
