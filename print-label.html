<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Label Stiker Aset - SI-ACEP</title>
  <link rel="stylesheet" href="print-style.css">
  <!-- QRCode.js Library untuk generate QR Code di halaman stiker -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="print-actions">
    <button class="btn-print-now" onclick="window.print()">🖨️ Cetak Label Sekarang</button>
    <button class="btn-close" onclick="window.close()">❌ Tutup</button>
  </div>

  <!-- Container Label Stiker Aset (Ukuran Standar Label Stiker Aset Pemda) -->
  <div class="label-container">
    <div class="label-header">
      <!-- Logo Kiri -->
      <img src="logo.png" alt="Logo Pemda" class="logo-left" id="img-logo-kiri">
      
      <div class="header-text">
        <h3>INVENTARIS KOTA SERANG</h3>
        <p>SATUAN POLISI PAMONG PRAJA</p>
      </div>

      <!-- Logo Kanan -->
      <img src="polpp.png" alt="Logo Satpol PP" class="logo-right" id="img-logo-kanan">
    </div>
    
    <div class="label-body">
      <div class="qr-code-box" id="qrcode-label">
        <!-- QR Code akan digenerate otomatis melalui JS -->
      </div>
      
      <div class="asset-info">
        <div class="info-row">
          <span class="label-title">Kode Barang:</span>
          <span class="label-val code" id="lbl-kode">-</span>
        </div>
        <div class="info-row">
          <span class="label-title">Nama Barang:</span>
          <span class="label-val" id="lbl-nama">-</span>
        </div>
        <div class="info-row">
          <span class="label-title">Tahun:</span>
          <span class="label-val" id="lbl-tahun">-</span>
        </div>
      </div>
    </div>

    <div class="label-footer">
      <span>SI-ACEP - SATPOL PP KOTA SERANG</span>
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
  // Ambil data staging JSON yang dikirim script.js
  const stagingRaw = localStorage.getItem("siasep_print_staging");
  
  let kode = localStorage.getItem("print_kode") || "-";
  let nama = localStorage.getItem("print_nama") || "-";
  let tahun = localStorage.getItem("print_tahun") || "-";
  let merk = "";

  if (stagingRaw) {
    const data = JSON.parse(stagingRaw);
    kode = data.kode;
    nama = data.nama;
    tahun = data.tahun;
    merk = data.merk;
  }

  // Tampilkan ke elemen label di HTML Anda
  document.getElementById("labelKode").textContent = kode;
  document.getElementById("labelNama").textContent = merk ? `${nama} (${merk})` : nama;
  document.getElementById("labelTahun").textContent = `Thn: ${tahun}`;

  // Generate QR Code
  new QRCode(document.getElementById("qrcode"), {
    text: kode,
    width: 80,
    height: 80
  });
});
  </script>
</body>
</html>
